<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open in Video Comparator</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <header>
    <h1>Video Comparator</h1>
    <div class="header-actions">
      <button id="refresh" type="button" title="Re-scan the page">Rescan</button>
      <button id="settings" type="button" title="Settings (Comparator URL)" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main>
    <div id="status" role="status">Scanning page…</div>

    <form id="form" hidden>
      <section id="videos-section">
        <div class="section-head">
          <h2>Videos</h2>
          <label class="select-all">
            <input id="select-all" type="checkbox" checked>
            <span id="video-count"></span>
          </label>
        </div>
        <div id="video-list" class="list"></div>
      </section>

      <section id="images-section" hidden>
        <div class="section-head">
          <h2>Reference image <span class="hint">(optional)</span></h2>
          <button id="clear-ref" type="button" class="link" hidden>clear</button>
        </div>
        <div id="image-list" class="list"></div>
      </section>

      <fieldset class="mode-group">
        <legend>When opening</legend>
        <label><input type="radio" name="mode" value="replace" checked> Replace current videos</label>
        <label><input type="radio" name="mode" value="append"> Add to current videos</label>
      </fieldset>

      <button id="open" type="submit">Open in Comparator</button>
    </form>
  </main>

  <script src="./popup.js"></script>
</body>
</html>
